# ---------------------------------------------------------------------------
# Workshop stage 3: the whole node -- sensor, LED strip, Thread mesh and CoAP
# publishing. Build the two earlier stages with FILE_SUFFIX=sensor and
# FILE_SUFFIX=display; see "Workshop stages" in the sample documentation.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Thread credentials
#
# WARNING: WORKSHOP CONFIGURATION, NOT FOR PRODUCTION.
#
# The network key below is compiled into every image and published in this
# repository. Anyone within radio range who has read this file can join the
# mesh, decrypt every frame and inject their own. That is deliberate here: it
# removes commissioning from the exercise so the demo comes up in seconds.
#
# A real deployment commissions each device instead -- Thread supports
# in-band joining (CONFIG_OPENTHREAD_JOINER with a per-device PSKd) and
# out-of-band provisioning of the operational dataset. The key is then unique
# per network and never leaves the commissioner.
# ---------------------------------------------------------------------------
CONFIG_OPENTHREAD_PANID=4660
CONFIG_OPENTHREAD_XPANID="11:11:11:11:22:22:22:22"
CONFIG_OPENTHREAD_NETWORKKEY="00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff"
CONFIG_OPENTHREAD_CHANNEL=15
CONFIG_OPENTHREAD_NETWORK_NAME="ZephyrWorkshop"

# Networking: OpenThread as the L2, full Thread device so the nodes form a
# real mesh and relay for each other instead of all talking to the router.
CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_FTD=y
CONFIG_OPENTHREAD_COAP=y
CONFIG_OPENTHREAD_SLAAC=y

# Persistent storage, used for the Thread dataset and for the node name
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# On-board SHT4x temperature and humidity sensor
CONFIG_SENSOR=y
CONFIG_I2C=y

# RGB LED strip visualisation, and SW0 to switch between the two quantities
CONFIG_LED_STRIP=y
CONFIG_INPUT=y

# Shell: participants set their node name here, and the OpenThread commands
# are handy for showing the mesh topology live.
CONFIG_SHELL=y
CONFIG_OPENTHREAD_SHELL=y
CONFIG_OPENTHREAD_PING_SENDER=y

# Logging. Every module registers its own log module, so each one has its own
# CONFIG_TELEMETRY_<module>_LOG_LEVEL and shows up under its own name in the
# log output. They all default to the global level, which is INF.
CONFIG_LOG=y

# Kernel. The SYS_INIT hooks of every module run on the main thread, and the
# publish work and the strip refresh share the system workqueue -- the CoAP
# path formats its JSON payload on that stack.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
