# ---------------------------------------------------------------------------
# Stage 0: the bare skeleton, and what you get without a FILE_SUFFIX.
#
# A shell, a log backend and the sensor driver -- nothing that runs on its
# own. Every stage of the workshop is one of the prj_<stage>.conf files next
# to this one, switched on with FILE_SUFFIX:
#
#   FILE_SUFFIX=sensor    stage 1  the reading on the console, and a name
#   FILE_SUFFIX=display   stage 2  plus the RGB LED strip
#   FILE_SUFFIX=mesh      stage 3  plus Thread and CoAP publishing
#
# Building without one is deliberately not the finished node: it is the
# starting point the stages add to. "telemetry sensor" reads the SHT4x on
# demand, and "telemetry status" prints the one line this build has.
# ---------------------------------------------------------------------------

# On-board SHT4x temperature and humidity sensor. The env_sensor module is the
# one module without a Kconfig switch -- every stage reads the sensor, so it is
# always compiled and its driver always has to be here.
CONFIG_SENSOR=y
CONFIG_I2C=y

# Shell: "telemetry status" and "telemetry sensor". Both are assembled by the
# linker out of the modules that were built, so they already work here with
# nothing but the sensor in the image.
CONFIG_SHELL=y

# Logging
CONFIG_LOG=y

# Nothing reads the sensor by itself yet. The periodic reading is what stage 1
# adds, so leave the console module out and use the shell instead.
CONFIG_TELEMETRY_SENSOR_CONSOLE=n

# Kernel. The SYS_INIT hooks of every module run on the main thread.
CONFIG_MAIN_STACK_SIZE=2048
