# ---------------------------------------------------------------------------
# Workshop stage 1: read the on-board sensor and print the reading.
#
# No radio, no networking, no LED strip. The node is the environment sensor,
# the console log, the node name and the shell. Everything the application
# adds later is switched off by its own Kconfig option, because the subsystem
# it depends on is simply not here.
# ---------------------------------------------------------------------------

# On-board SHT4x temperature and humidity sensor
CONFIG_SENSOR=y
CONFIG_I2C=y

# Persistent storage, used for the node name
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Shell: "telemetry status", "telemetry sensor", "telemetry name"
CONFIG_SHELL=y

# Logging
CONFIG_LOG=y

# Kernel. The SYS_INIT hooks of every module run on the main thread, and the
# periodic read runs on the system workqueue.
CONFIG_MAIN_STACK_SIZE=2048
