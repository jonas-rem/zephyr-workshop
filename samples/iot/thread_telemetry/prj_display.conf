# ---------------------------------------------------------------------------
# Workshop stage 2: stage 1 plus the RGB LED strip.
#
# Still no radio. CONFIG_LED_STRIP is what makes CONFIG_TELEMETRY_DISPLAY
# available, so the display module appears in menuconfig and is built.
# ---------------------------------------------------------------------------

# On-board SHT4x temperature and humidity sensor
CONFIG_SENSOR=y
CONFIG_I2C=y

# Persistent storage, used for the node name
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# RGB LED strip visualisation, and SW0 to switch between the two quantities
CONFIG_LED_STRIP=y
CONFIG_INPUT=y

# Shell: "telemetry display" switches quantity without reaching for SW0
CONFIG_SHELL=y

# Logging
CONFIG_LOG=y

# Kernel. The SYS_INIT hooks of every module run on the main thread, and the
# periodic read and the strip refresh run on the system workqueue.
CONFIG_MAIN_STACK_SIZE=2048
