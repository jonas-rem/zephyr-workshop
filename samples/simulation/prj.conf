CONFIG_LOG=y
# Flush the deferred log promptly so traces follow the event that caused them.
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_APP_SIM_BUTTON_LOG_LEVEL_DBG=y
CONFIG_APP_SIM_SENSOR_LOG_LEVEL_DBG=y
CONFIG_APP_SIM_LED_LOG_LEVEL_DBG=y

CONFIG_APP_SIM_BUTTON=y
CONFIG_APP_SIM_SENSOR=y
CONFIG_APP_SIM_LED=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_MSG_SUBSCRIBER_BUF_ALLOC_STATIC=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_STATIC_DATA_SIZE=32
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=16

CONFIG_SHELL=y
