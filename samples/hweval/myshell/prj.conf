# Multi-threaded, with thread monitoring and timer support in the kernel
CONFIG_ERRNO=y

CONFIG_MULTITHREADING=y
CONFIG_NUM_COOP_PRIORITIES=16
CONFIG_NUM_METAIRQ_PRIORITIES=0

CONFIG_SCHED_SIMPLE=y
CONFIG_WAITQ_SIMPLE=y

CONFIG_INIT_STACKS=y

CONFIG_POSIX_API=y
CONFIG_POSIX_TIMERS=y

# Thread monitoring and statistics in the kernel
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=y

# Shell with log, getopt, stats and full command set
CONFIG_BOOT_BANNER=y
CONFIG_DATE_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_DEVMEM_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_CMDS=y
CONFIG_STATS=y
CONFIG_STATS_SHELL=y
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_SHELL_GETOPT=y
CONFIG_SHELL_HELP=y

# Shell with hwinfo, regulator, and counter commands
CONFIG_COUNTER=y
CONFIG_COUNTER_SHELL=y
CONFIG_HWINFO=y
CONFIG_HWINFO_SHELL=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_SHELL=y

# Shell with eeprom, flash, led, rtc, and sensor commands
CONFIG_EEPROM=y
CONFIG_EEPROM_SHELL=y
CONFIG_FLASH=y
CONFIG_FLASH_SHELL=y
CONFIG_LED=y
CONFIG_LED_SHELL=y
CONFIG_RTC=y
CONFIG_RTC_SHELL=y
CONFIG_SENSOR=y
CONFIG_SENSOR_INFO=y
CONFIG_SENSOR_SHELL=y

# Shell with adc, dac, pwm, gpio, and i2c commands
CONFIG_ADC=y
CONFIG_ADC_SHELL=y
CONFIG_DAC=y
CONFIG_DAC_SHELL=y
CONFIG_GPIO=y
CONFIG_GPIO_SHELL=y
CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_PWM=y
CONFIG_PWM_SHELL=y
