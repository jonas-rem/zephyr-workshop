sample:
  description: Simplified event-driven test application
  name: sim_test_track

tests:
  sim_test_track.basic:
    platform_allow:
      - native_sim
      - reel_board
    integration_platforms:
      - native_sim
      - reel_board
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Sim and testing track booted"

  sim_test_track.e2e.native_sim:
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    harness: pytest
    extra_dtc_overlay_files:
      - pytest/native_sim.overlay
    harness_config:
      pytest_root:
        - pytest/test_sensor_shell.py
    tags:
      - sim_test_track
      - e2e
      - pytest
      - shell
    timeout: 20

  sim_test_track.e2e.hil:
    platform_allow:
      - reel_board
    harness: pytest
    harness_config:
      pytest_root:
        - pytest/test_sensor_shell.py
      fixture:
        - workshop_app
    tags:
      - sim_test_track
      - e2e
      - hil
      - pytest
      - shell
    # Covers flashing over DAPLink, boot and the test itself.
    timeout: 120
