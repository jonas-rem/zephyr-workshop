name: Build Samples

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 8 * * *'  # Run daily at 8 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    # Use ci-base image and install only the required toolchain to save disk
    # space
    container:
      image: ghcr.io/zephyrproject-rtos/ci-base:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize West
        run: |
          west init -l .
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: Install Dependencies
        run: |
          pip install -r ../zephyr/scripts/requirements.txt

      - name: Setup SDK
        # Install only the ARM and x86 toolchains to minimize download size and
        # disk usage
        run: |
          west sdk install --gnu-toolchains arm-zephyr-eabi x86_64-zephyr-elf

      - name: Build and Test
        run: |
          west twister -T app -T samples --integration --exclude-tag workshop --inline-logs

      - name: Upload Twister logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: twister-logs
          path: |
            twister-out/**/build.log
            twister-out/**/handler.log
            twister-out/**/twister_harness.log
            twister-out/*.json
            twister-out/*.xml
          if-no-files-found: warn
          retention-days: 7
