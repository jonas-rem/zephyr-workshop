name: Build Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production
# deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache
      DOCS_VERSION: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}
      DOCS_BASE_URL: /${{ github.event.repository.name }}/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install PDF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fonts-dejavu \
            latexmk \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-xetex \
            xindy

      - name: Install dependencies
        timeout-minutes: 10
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          npm --prefix slides ci
          touch slides/node_modules/.installed
        working-directory: doc

      - name: Install Playwright browsers
        timeout-minutes: 20
        run: |
          npm --prefix slides exec playwright install -- --with-deps chromium
        working-directory: doc

      - name: Build Documentation
        run: make docs

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: html-docs
          path: doc/_build/html/
          if-no-files-found: error

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DOCS_BASE_URL: /${{ github.event.repository.name }}/
    steps:
      - name: Download main documentation
        uses: actions/download-artifact@v7
        with:
          name: html-docs
          path: site

      - name: Add release documentation
        run: |
          echo "main" > versions.txt
          for tag in $(gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName'); do
            asset="zephyr-workshop-docs-${tag//\//-}.tar.gz"
            if gh release download "$tag" --pattern "$asset" --dir releases; then
              mkdir -p "site/$tag"
              tar -xzf "releases/$asset" -C "site/$tag" --strip-components=1
              echo "$tag" >> versions.txt
            fi
          done
          jq -R --arg base "$DOCS_BASE_URL" \
            '{name: ., url: ($base + (if . == "main" then "" else . + "/" end))}' \
            versions.txt | jq -s . > site/versions.json
          cat site/versions.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
